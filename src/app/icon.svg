      <stop offset="65%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="icon_leftHighlight" x1="50" y1="40" x2="110" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#67E8F9" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="icon_rightGrad" x1="120" y1="180" x2="216" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
