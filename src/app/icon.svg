<svg viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="icon_leftGrad" x1="45" y1="36" x2="140" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" />
