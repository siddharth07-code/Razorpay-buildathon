      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="92%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="icon_foldGrad" x1="125" y1="70" x2="185" y2="135" gradientUnits="userSpaceOnUse">
