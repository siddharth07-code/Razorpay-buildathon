  <!-- Background Dark Rounded Square for Crisp App Icon Visibility -->
  <rect width="256" height="256" rx="56" fill="#05080D" />
  <rect width="254" height="254" x="1" y="1" rx="55" stroke="#151E2E" stroke-width="2" />
  
  <!-- Ambient Glow -->
  <circle cx="128" cy="136" r="80" fill="#22D3EE" opacity="0.15" filter="blur(16px)" />

  <!-- Apex Neon Glow -->
  <path d="M 104 186 C 114 204, 122 214, 128 214 C 134 214, 142 204, 152 186" stroke="url(#icon_apexGlow)" stroke-width="12" stroke-linecap="round" opacity="0.7" />

  <!-- Right Wing Fold -->
  <path d="M 128 116 L 168 44 L 198 44 C 182 78, 160 114, 142 144 C 135 132, 130 122, 128 116 Z" fill="url(#icon_foldGrad)" />

  <!-- Right Wing Blade -->
  <path d="M 214 44 L 172 44 C 154 84, 136 130, 128 168 C 132 178, 138 188, 144 196 C 158 174, 184 122, 214 44 Z" fill="url(#icon_rightGrad)" />

  <!-- Left Wing Blade -->
  <path d="M 44 44 L 86 44 C 94 76, 108 118, 128 156 C 132 164, 136 174, 134 186 C 132 198, 124 206, 114 204 C 104 202, 96 190, 88 174 C 74 144, 58 98, 44 44 Z" fill="url(#icon_leftGrad)" />

  <!-- Center Loop Fold -->
  <path d="M 114 204 C 122 206, 130 206, 136 198 C 142 190, 146 178, 142 164 C 138 150, 130 138, 126 126 C 122 138, 118 154, 114 172 C 112 182, 110 196, 114 204 Z" fill="#0284C7" />

  <!-- Left Specular Edge -->
